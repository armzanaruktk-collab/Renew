name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-33 ndk;25.2.9519653'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/ndk/25.2.9519653"
           
      - name: Setup debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godarmxvpn-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: GodArmX Vpn Build #${{ github.run_number }}
          body: |
            ## 📱 VPN Settings Android App

            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            ### 📥 ดาวน์โหลดไฟล์ติดตั้ง:
            ดาวน์โหลดไฟล์ `.apk` ด้านล่างนี้เพื่อนำไปติดตั้งบนอุปกรณ์ Android ได้ทันที
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
